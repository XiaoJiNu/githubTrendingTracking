name: Daily GitHub Trending

# 每天 09:00（北京时间 = 01:00 UTC）抓取 GitHub Trending，
# 生成 daily/YYYY-MM-DD.md、更新 categories.md / data/repos.json / README 最新区块并推回 main。
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-trending
  cancel-in-progress: false

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Fetch trending and render reports
        run: python scripts/fetch_trending.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add daily categories.md data/repos.json README.md
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 自动更新 $(date -u -d '+8 hours' +%F) Trending 日报"
          git pull --rebase origin main
          git push origin HEAD:main
